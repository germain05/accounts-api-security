# Layer 1 of the egress control: default-deny at L3/L4. Threats T5, T2.
# Rationale and the honest list of what this still fails to stop: docs/05-egress.md
---
# Namespace-wide default deny. This goes in FIRST and on its own, because a
# default-deny that lands at the same time as its allow rules is a rollback
# waiting to happen and nobody can tell which rule broke the service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: accounts
spec:
  podSelector: {}
  policyTypes: [Egress]
  # no egress: block — every destination must be named below
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: accounts-api-egress
  namespace: accounts
  annotations:
    example-bank.io/threat: "T5 — data egress; T2 — C2 channel"
spec:
  podSelector:
    matchLabels:
      app: accounts-api
  policyTypes: [Egress]
  egress:
    # DNS. Restricted to CoreDNS pods rather than "UDP/53 anywhere", because
    # UDP/53 to the world is a serviceable exfiltration channel and a very
    # common hole in otherwise tight egress policies.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }

    # The KYC call does NOT go direct. It goes to the Istio egress gateway, which
    # is where the FQDN and the certificate are pinned (istio-egress.yaml).
    # A NetworkPolicy cannot express "only this hostname" — it works on IPs, and
    # a SaaS provider's IPs change without notice.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: istio-system }
          podSelector:
            matchLabels: { istio: egressgateway }
      ports:
        - { protocol: TCP, port: 443 }

    # RDS and MSK, by CIDR because they are ENIs in our own private subnets and
    # those CIDRs are ours and stable.
    - to:
        - ipBlock: { cidr: 10.42.32.0/20 }   # data subnets: RDS
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - ipBlock: { cidr: 10.42.48.0/20 }   # msk subnets
      ports:
        - { protocol: TCP, port: 9094 }      # TLS listener only; 9092 plaintext is not permitted
---
# Ingress side: only the ALB target group reaches the pods. Without this, any of
# the twelve co-tenant services can call accounts-api directly and skip the WAF,
# the ALB's mTLS, and the edge rate limits — which is how "authenticated API"
# quietly becomes "authenticated at the edge only".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: accounts-api-ingress
  namespace: accounts
spec:
  podSelector:
    matchLabels: { app: accounts-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress }
          podSelector:
            matchLabels: { app: aws-load-balancer-controller-target }
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
          podSelector:
            matchLabels: { app: prometheus }
      ports:
        - { protocol: TCP, port: 9090 }
