# Layer 2 of the redaction design (docs/06-log-redaction.md). Defence in depth —
# NOT the primary control. This layer sees text and has to guess; the application
# layer sees types and does not. If this filter is the thing catching PII, the
# application has a bug and the `redaction_hits` metric below is how we find out.

[SERVICE]
    Flush         5
    Log_Level     info
    Parsers_File  parsers.conf

[INPUT]
    Name              tail
    Tag               kube.accounts.*
    Path              /var/log/containers/accounts-api-*.log
    Parser            cri
    Mem_Buf_Limit     16MB
    Skip_Long_Lines   On

[FILTER]
    Name                kubernetes
    Match               kube.accounts.*
    Merge_Log           On
    Keep_Log            Off
    Labels              On
    Annotations         Off

# Drop known-sensitive keys outright, at any nesting depth. Cheaper and more
# reliable than pattern-matching their values.
[FILTER]
    Name    nest
    Match   kube.accounts.*
    Operation lift
    Nested_under log

[FILTER]
    Name    modify
    Match   kube.accounts.*
    Remove  password
    Remove  passwd
    Remove  authorization
    Remove  Authorization
    Remove  set-cookie
    Remove  cookie
    Remove  iban
    Remove  IBAN
    Remove  pan
    Remove  card_number
    Remove  cvv
    Remove  db_credential

# Value scrubbing for the cases a key name does not catch (PII inside a free-text
# message or an error string). Patterns are deliberately NARROW: a generic
# \d{13,19} would eat transaction ids and latencies, produce logs nobody can debug
# with, and end with somebody disabling this filter — which is the real failure mode.
[FILTER]
    Name   lua
    Match  kube.accounts.*
    script redact.lua
    call   redact

# --- redact.lua -------------------------------------------------------------
# local IBAN = "%u%u%d%d[%u%d]+"                  -- ISO 13616 shape
# local EMAIL = "[%w%.%-_]+@[%w%.%-_]+%.%a%a+"
# function redact(tag, ts, record)
#   local hits = 0
#   for k, v in pairs(record) do
#     if type(v) == "string" then
#       local s, n = v:gsub(IBAN, "[REDACTED:iban]");   hits = hits + n
#       s, n       = s:gsub(EMAIL, "[REDACTED:email]"); hits = hits + n
#       -- PAN: 13-19 digits AND a passing Luhn check. The Luhn check is what
#       -- keeps this from matching every long number in the estate.
#       s, n       = luhn_gsub(s, "[REDACTED:pan]");    hits = hits + n
#       record[k] = s
#     end
#   end
#   if hits > 0 then record["_redaction_hits"] = hits end
#   return 2, ts, record
# end
# ----------------------------------------------------------------------------

# The metric is the point of this layer. A non-zero rate means the application
# layer has a hole; a rising rate means a regression shipped. Alert on the rate,
# not on the individual record — the record has already been scrubbed and there is
# nothing to look at, whereas the rate is actionable.
[OUTPUT]
    Name            cloudwatch_logs
    Match           kube.accounts.*
    region          ap-south-1
    log_group_name  /aws/eks/accounts-api/application
    log_stream_prefix accounts-api-
    log_retention_days 90
    auto_create_group false
    metric_namespace  accounts-api/logging
    metric_dimensions redaction_hits
